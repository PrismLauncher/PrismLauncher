name: Build (Windows MSVC only)

on:
  workflow_dispatch:
  push:
    branches: [ develop, main ]
  pull_request:

permissions: {}

jobs:
  build-windows-msvc:
    name: Build Windows MSVC (zip + installer)
    runs-on: windows-2022

    permissions:
      contents: read
      id-token: write
      packages: write

    env:
      BUILD_TYPE: Release
      CMAKE_PRESET: windows_msvc
      BUILD_DIR: build
      INSTALL_DIR: install

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      # Uses your repo's existing dependency setup action
      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.10.2

      - name: Configure
        shell: bash
        run: cmake --preset "$CMAKE_PRESET"

      - name: Build
        shell: bash
        run: cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Test
        shell: bash
        run: ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE" --extra-verbose --output-on-failure

      - name: Install
        shell: pwsh
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Generate manifest
        shell: pwsh
        run: |
          Get-ChildItem ${{ env.INSTALL_DIR }} -Recurse |
            ForEach-Object FullName |
            Resolve-Path -Relative |
            ForEach-Object { $_.TrimStart('.\') } |
            ForEach-Object { $_.TrimStart('${{ env.INSTALL_DIR }}') } |
            ForEach-Object { $_.TrimStart('\') } |
            Out-File -FilePath ${{ env.INSTALL_DIR }}/manifest.txt

      - name: Get short version
        id: short-version
        shell: bash
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create ZIP artifact
        shell: pwsh
        run: |
          $zipName = "PrismLauncher-Windows-MSVC-${{ steps.short-version.outputs.version }}.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "${{ env.INSTALL_DIR }}\\*" -DestinationPath $zipName -Force
          Write-Host "Created $zipName"

      - name: Build NSIS installer (.exe)
        shell: pwsh
        env:
          NSCURL_VERSION: "v24.9.26.122"
          NSCURL_SHA256: "AEE6C4BE3CB6455858E9C1EE4B3AFE0DB9960FA03FE99CCDEDC28390D57CCBB0"
        run: |
          New-Item -Name NSISPlugins -ItemType Directory -Force
          Invoke-WebRequest "https://github.com/negrutiu/nsis-nscurl/releases/download/${{ env.NSCURL_VERSION }}/NScurl.zip" -OutFile "NSISPlugins\\NScurl.zip"

          $nscurl_hash = (Get-FileHash "NSISPlugins\\NScurl.zip" -Algorithm Sha256).Hash
          if ($nscurl_hash -ne "${{ env.NSCURL_SHA256 }}") {
            Write-Error "NSCurl.zip sha256 mismatch"
            exit 1
          }

          Expand-Archive -Path "NSISPlugins\\NScurl.zip" -DestinationPath "NSISPlugins\\NScurl" -Force

          Push-Location ${{ env.INSTALL_DIR }}
          makensis -NOCD "${{ github.workspace }}/${{ env.BUILD_DIR }}/program_info/win_install.nsi"
          Pop-Location

      - name: Upload ZIP
        uses: actions/upload-artifact@v6
        with:
          name: PrismLauncher-Windows-MSVC-${{ steps.short-version.outputs.version }}
          path: PrismLauncher-Windows-MSVC-${{ steps.short-version.outputs.version }}.zip

      - name: Upload installer EXE
        uses: actions/upload-artifact@v6
        with:
          name: PrismLauncher-Windows-MSVC-Setup-${{ steps.short-version.outputs.version }}
          path: PrismLauncher-Setup.exe
